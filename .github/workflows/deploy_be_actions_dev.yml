name: active aws codedeploy(fastapi backend server) - DEV

on:
  # dev 브랜치 push 시 스테이징(api-dev) 배포 트리거
  push:
    branches: [ "dev" ]

  # 수동 배포 트리거 (긴급 배포/재시도용)
  workflow_dispatch:
    inputs:
      tags:
        description: '(option) input additional comments'

permissions:
  contents: read

jobs:
  BuildAndRunBeServerDev:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Poetry Setup
        run: |
          curl -sSL https://install.python-poetry.org | python3 -

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Poetry Build (DEV)
        run: |
          # NOTE(DEV):
          # - dev는 "검증 환경"이라 자동 버전 bump/자동 commit/push를 하지 않습니다.
          # - 배포 산출물(wheel)만 생성합니다.
          poetry install
          poetry run python tests/test_ai_reader_worker_deploy.py
          poetry run python -m unittest tests.test_admin_cash_charge_cancel_service
          bash -n dist/run_be.dev.sh
          bash -n dist/boot-start-api-dev.sh
          bash -n dist/verify_backend_dev_deploy.sh
          shellcheck --severity=warning dist/run_be.dev.sh dist/boot-start-api-dev.sh dist/verify_backend_dev_deploy.sh
          poetry build
        working-directory: ./fastapi_be_server

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ---------------------------------------------------------------------
      # Build env file (DO NOT COMMIT)
      # ---------------------------------------------------------------------
      - name: Write .env.production (DEV)
        working-directory: ./fastapi_be_server/dist
        env:
          BACKEND_ENV_DEV: ${{ secrets.BACKEND_ENV_DEV }}
        run: |
          set -e
          printf '%s' "$BACKEND_ENV_DEV" | tr -d '\r' > .env.production

      - name: Deploy with AWS codedeploy (DEV)
        id: deploy
        env:
          # DEV용 CodeDeploy 설정은 하드코딩하지 않고 Secrets로 주입합니다.
          # - 운영/스테이징 배포 타겟이 섞이면 사고가 나므로, 반드시 분리된 값으로 설정하세요.
          APPLICATION_NAME: ${{ secrets.CODEDEPLOY_APP_NAME_BACKEND_DEV }}
          DEPLOY_CONFIG_NAME: ${{ secrets.CODEDEPLOY_CONFIG_NAME_BACKEND_DEV }}
          DEPLOY_GROUP_NAME: ${{ secrets.CODEDEPLOY_GROUP_NAME_BACKEND_DEV }}
          S3_BUCKET: ${{ secrets.CODEDEPLOY_S3_BUCKET }}
          TAGS: ${{ inputs.tags }}
        run: |
          set -euo pipefail
          if [ -z "$APPLICATION_NAME" ] || [ -z "$DEPLOY_GROUP_NAME" ] || [ -z "$S3_BUCKET" ]; then
            echo "[ERROR] Missing required CodeDeploy secrets for DEV."
            echo "  - CODEDEPLOY_APP_NAME_BACKEND_DEV"
            echo "  - CODEDEPLOY_GROUP_NAME_BACKEND_DEV"
            echo "  - CODEDEPLOY_S3_BUCKET"
            echo "  (optional) CODEDEPLOY_CONFIG_NAME_BACKEND_DEV"
            exit 1
          fi

          # 기본값: CodeDeployDefault.AllAtOnce
          if [ -z "$DEPLOY_CONFIG_NAME" ]; then
            DEPLOY_CONFIG_NAME="CodeDeployDefault.AllAtOnce"
          fi

          # dev 전용 설정 파일로 교체
          cp appspec.dev.yml appspec.yml
          cp before_install.dev.sh before_install.sh
          cp run_be.dev.sh run_be.sh
          cp gconf.dev.py gconf.py
          chmod +x before_install.sh run_be.sh boot-start-api-dev.sh
          mkdir -p scripts
          cp ../scripts/build_story_agent_context.py ./scripts/build_story_agent_context.py
          cp ../scripts/run_ai_reader_worker.py ./scripts/run_ai_reader_worker.py

          # *.whl, appspec.yml, before_install.sh, run_be.sh, gconf.py, boot-start-api-dev.sh, .env.production 파일 압축해서 S3로 보낸 후, codedeploy 트리거 발생
          zip -r "$GITHUB_SHA.zip" *.whl appspec.yml before_install.sh run_be.sh boot-start-api-dev.sh gconf.py .env.production init/ batch/ scripts/
          aws s3 cp "$GITHUB_SHA.zip" "s3://$S3_BUCKET/$GITHUB_SHA.zip"
          DEPLOY_ID=$(aws deploy create-deployment \
            --application-name "$APPLICATION_NAME" \
            --deployment-config-name "$DEPLOY_CONFIG_NAME" \
            --deployment-group-name "$DEPLOY_GROUP_NAME" \
            --description "backend server deploy (DEV)" \
            --s3-location "bucket=$S3_BUCKET,bundleType=zip,key=$GITHUB_SHA.zip" \
            --query deploymentId \
            --output text)
          echo "CodeDeploy deployment id: $DEPLOY_ID"
          echo "deployment_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"
          if ! aws deploy wait deployment-successful --deployment-id "$DEPLOY_ID"; then
            aws deploy get-deployment --deployment-id "$DEPLOY_ID" || true
            exit 1
          fi
          aws deploy get-deployment --deployment-id "$DEPLOY_ID"
          echo "(option) input additional comments: $TAGS"
        working-directory: ./fastapi_be_server/dist

      - name: Verify dev backend runtime
        env:
          EXPECTED_DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_DEPLOYMENT_ID" =~ ^d-[A-Za-z0-9]+$ ]]; then
            echo "[ERROR] Invalid CodeDeploy deployment id: $EXPECTED_DEPLOYMENT_ID" >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/likenovel_dev_deploy_key
          chmod 600 ~/.ssh/likenovel_dev_deploy_key
          ssh -i ~/.ssh/likenovel_dev_deploy_key -o StrictHostKeyChecking=no -T ln-admin@ec2-3-34-11-39.ap-northeast-2.compute.amazonaws.com \
            "ssh -i /home/ln-admin/.ssh/ln_kp.pem -o StrictHostKeyChecking=no -T ln-admin@10.0.100.110 bash -s -- '$EXPECTED_DEPLOYMENT_ID'" \
            < ./verify_backend_dev_deploy.sh
          PUBLIC_HEALTH_STATUS=$(curl --fail --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 2 --max-time 10 \
            --output /dev/null --write-out '%{http_code}' \
            https://api.likenovel.dev/health)
          if [[ "$PUBLIC_HEALTH_STATUS" != 2* ]]; then
            echo "[ERROR] Public DEV health returned HTTP $PUBLIC_HEALTH_STATUS" >&2
            exit 1
          fi
        working-directory: ./fastapi_be_server/dist
